<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Delivery Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: linear-gradient(135deg, #0d6efd 0%, #6dd5ed 100%); min-height: 100vh; }
        .reset-container { max-width: 450px; margin: 60px auto; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); padding: 2.5rem 2rem; }
        .logo { font-size: 2.5rem; color: #0d6efd; margin-bottom: 1rem; text-align: center; }
        .password-strength { margin-top: 10px; height: 5px; background-color: #e0e0e0; border-radius: 3px; overflow: hidden; }
        .password-strength-bar { height: 100%; width: 0%; transition: width 0.3s ease; }
        .strength-weak { background-color: #f44336; }
        .strength-fair { background-color: #ff9800; }
        .strength-good { background-color: #8bc34a; }
        .strength-text { font-size: 12px; margin-top: 5px; color: #999; }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo"><i class="fas fa-shipping-fast"></i></div>
        <h3 class="text-center mb-4">Đặt lại mật khẩu</h3>
        
        <form id="resetForm" autocomplete="off">
            <div class="mb-3">
                <label class="form-label">Mật khẩu mới</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
                <small class="form-text text-muted d-block mt-2">
                    Mật khẩu phải có ít nhất 8 ký tự, bao gồm: chữ hoa, chữ thường, số và ký tự đặc biệt
                </small>
            </div>

            <div class="mb-3">
                <label class="form-label">Xác nhận mật khẩu</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Đặt lại mật khẩu</button>
        </form>

        <div class="text-center mt-3">
            <a href="forgot-password.html">Quay lại</a>
        </div>

        <div id="resetAlert" class="mt-3"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
