<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực 2 yếu tố - Delivery Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .verify-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .verify-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
            color: white;
        }
        .otp-input {
            width: 50px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 0 5px;
            transition: all 0.3s;
        }
        .otp-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            outline: none;
        }
        .btn-verify {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            transition: transform 0.2s;
        }
        .btn-verify:hover {
            transform: translateY(-2px);
        }
        .resend-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .resend-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="verify-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h3 class="text-center mb-2">Xác thực 2 yếu tố</h3>
        <p class="text-center text-muted mb-4">Nhập mã 6 chữ số đã được gửi đến email của bạn</p>
        
        <div id="alert-container"></div>

        <form id="verifyForm">
            <div class="d-flex justify-content-center mb-4">
                <input type="text" class="otp-input" maxlength="1" data-index="0">
                <input type="text" class="otp-input" maxlength="1" data-index="1">
                <input type="text" class="otp-input" maxlength="1" data-index="2">
                <input type="text" class="otp-input" maxlength="1" data-index="3">
                <input type="text" class="otp-input" maxlength="1" data-index="4">
                <input type="text" class="otp-input" maxlength="1" data-index="5">
            </div>

            <button type="submit" class="btn btn-verify btn-primary w-100 mb-3">
                <i class="fas fa-check-circle me-2"></i>Xác nhận
            </button>
        </form>

        <div class="text-center">
            <p class="text-muted mb-2">Không nhận được mã?</p>
            <a href="#" id="resendBtn" class="resend-link">
                <i class="fas fa-redo me-1"></i>Gửi lại mã
            </a>
        </div>

        <div class="text-center mt-4">
            <a href="login.html" class="text-muted">
                <i class="fas fa-arrow-left me-1"></i>Quay lại đăng nhập
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-service.js"></script>
    <script>
        const otpInputs = document.querySelectorAll('.otp-input');
        const verifyForm = document.getElementById('verifyForm');
        const resendBtn = document.getElementById('resendBtn');
        const alertContainer = document.getElementById('alert-container');

        // Get userId from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const userId = parseInt(urlParams.get('userId'));

        if (!userId) {
            window.location.href = 'login.html';
        }

        // Auto focus and navigation between OTP inputs
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // Only allow numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Auto focus first input
        otpInputs[0].focus();

        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const code = Array.from(otpInputs).map(input => input.value).join('');
            
            if (code.length !== 6) {
                showAlert('Vui lòng nhập đầy đủ 6 chữ số', 'danger');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/verify-2fa`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        code: code
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.message || 'Mã xác thực không đúng', 'danger');
                    // Clear inputs
                    otpInputs.forEach(input => input.value = '');
                    otpInputs[0].focus();
                    return;
                }

                // Save token and user info
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showAlert('Xác thực thành công! Đang chuyển hướng...', 'success');

                // Redirect based on role
                setTimeout(() => {
                    switch (data.user.role) {
                        case 'admin':
                            window.location.href = 'index.html';
                            break;
                        case 'shipper':
                            window.location.href = 'shipper/index.html';
                            break;
                        case 'customer':
                            window.location.href = 'customer/index.html';
                            break;
                        default:
                            window.location.href = 'index.html';
                    }
                }, 1500);

            } catch (error) {
                console.error('Error:', error);
                showAlert('Có lỗi xảy ra. Vui lòng thử lại!', 'danger');
            }
        });

        resendBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/resend-2fa`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Mã mới đã được gửi đến email của bạn!', 'success');
                    // Clear inputs
                    otpInputs.forEach(input => input.value = '');
                    otpInputs[0].focus();
                } else {
                    showAlert(data.message || 'Không thể gửi lại mã', 'danger');
                }

            } catch (error) {
                console.error('Error:', error);
                showAlert('Có lỗi xảy ra. Vui lòng thử lại!', 'danger');
            }
        });

        function showAlert(message, type) {
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }
    </script>
</body>
</html>
