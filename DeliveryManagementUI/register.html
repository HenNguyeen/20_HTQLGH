<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Delivery Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- Left Side - Form Section -->
        <div class="auth-form-section">
            <div class="auth-form-wrapper">
                <!-- Logo and Brand -->
                <div class="auth-logo">
                    <div class="auth-logo-icon">
                        <i class="fas fa-shipping-fast"></i>
                    </div>
                    <h1>Quản Lý Giao Hàng</h1>
                    <p>Hệ thống quản lý vận chuyển hiện đại</p>
                </div>

                <!-- Register Form -->
                <div class="auth-form-content">
                    <h2>Tạo tài khoản mới</h2>
                    
                    <form id="registerForm" autocomplete="off">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Họ và tên" required autofocus>
                            <label for="fullName">Họ và tên</label>
                        </div>

                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                            <label for="email">Email</label>
                        </div>

                        <div class="form-floating">
                            <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="Số điện thoại" required>
                            <label for="phoneNumber">Số điện thoại</label>
                        </div>

                        <div class="form-floating">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Tên đăng nhập" required>
                            <label for="username">Tên đăng nhập</label>
                        </div>

                        <div class="form-floating" style="position: relative;">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Mật khẩu" required>
                            <label for="password">Mật khẩu</label>
                            <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                        </div>

                        <div class="form-floating" style="position: relative;">
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu" required>
                            <label for="confirmPassword">Xác nhận mật khẩu</label>
                            <i class="fas fa-eye password-toggle" id="toggleConfirmPassword"></i>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input" id="acceptTerms" required>
                            <label class="form-check-label" for="acceptTerms">
                                Tôi đồng ý với <a href="#" class="auth-link">Điều khoản dịch vụ</a> và <a href="#" class="auth-link">Chính sách bảo mật</a>
                            </label>
                        </div>

                        <button type="submit" class="auth-submit-btn">
                            <span>Đăng ký</span>
                        </button>
                    </form>

                    <!-- Login Link -->
                    <div class="auth-footer">
                        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
                    </div>

                    <!-- Alert Message -->
                    <div id="registerAlert"></div>
                </div>
            </div>
        </div>

        <!-- Right Side - Background Section -->
        <div class="auth-background-section">
            <div class="auth-background-content">
                <div class="auth-background-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>Bắt đầu hành trình</h2>
                <p>Tham gia hệ thống quản lý giao hàng hiện đại, tối ưu hóa quy trình và nâng cao hiệu quả công việc</p>
                
                <div class="auth-features">
                    <div class="feature-item">
                        <i class="fas fa-rocket"></i>
                        <span>Dễ dàng sử dụng</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-clock"></i>
                        <span>Tiết kiệm thời gian</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-headset"></i>
                        <span>Hỗ trợ 24/7</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-certificate"></i>
                        <span>Miễn phí dùng thử</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Password Toggle
        document.getElementById('togglePassword')?.addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('toggleConfirmPassword')?.addEventListener('click', function() {
            const passwordInput = document.getElementById('confirmPassword');
            const icon = this;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
