<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Password Shipper2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4>🔧 Sửa password cho Shipper2</h4>
            </div>
            <div class="card-body">
                <p>Username trong DB: <strong>Shipper2</strong> (viết hoa S)</p>
                <p>Thử login với các password sau:</p>
                <div class="list-group mb-3">
                    <div class="list-group-item">Username: <code>Shipper2</code> / Password: <code>123456</code></div>
                    <div class="list-group-item">Username: <code>Shipper2</code> / Password: <code>shipper123</code></div>
                </div>
                <hr>
                <h5>Hoặc reset password về 123456:</h5>
                <button class="btn btn-danger" onclick="resetPasswordShipper2()">Reset Password Shipper2 → 123456</button>
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        async function resetPasswordShipper2() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Đang xử lý...';
            
            try {
                // Phải login admin trước
                const loginResponse = await fetch('http://localhost:5221/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                if (!loginResponse.ok) {
                    throw new Error('Không thể login admin');
                }
                
                const loginData = await loginResponse.json();
                const token = loginData.token;
                
                // Lấy userId của Shipper2
                const usersResponse = await fetch('http://localhost:5221/api/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const users = await usersResponse.json();
                const shipper2 = users.find(u => u.username.toLowerCase() === 'shipper2');
                
                if (!shipper2) {
                    throw new Error('Không tìm thấy user Shipper2');
                }
                
                // Update password
                const updateResponse = await fetch(`http://localhost:5221/api/users/${shipper2.userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        userId: shipper2.userId,
                        username: shipper2.username,
                        password: '123456', // Password mới
                        fullName: shipper2.fullName,
                        email: shipper2.email,
                        phoneNumber: shipper2.phoneNumber,
                        role: shipper2.role
                    })
                });
                
                if (updateResponse.ok) {
                    resultDiv.innerHTML = `<div class="alert alert-success">
                        ✅ Reset thành công!<br>
                        <strong>Username:</strong> Shipper2<br>
                        <strong>Password:</strong> 123456<br>
                        <a href="shipper/login.html" class="btn btn-primary mt-2">Đi tới trang login</a>
                    </div>`;
                } else {
                    const error = await updateResponse.text();
                    resultDiv.innerHTML = '<div class="alert alert-danger">❌ Lỗi: ' + error + '</div>';
                }
            } catch (err) {
                resultDiv.innerHTML = '<div class="alert alert-danger">❌ Lỗi: ' + err.message + '</div>';
            }
        }
    </script>
</body>
</html>
