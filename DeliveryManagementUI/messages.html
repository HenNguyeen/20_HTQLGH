<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tin Nhắn - Admin</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/messages.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-shipping-fast"></i>
            <h4>Quản Lý Giao Hàng</h4>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="index.html">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="orders.html">
                    <i class="fas fa-box"></i>
                    <span>Đơn Hàng</span>
                </a>
            </li>
            <li>
                <a href="customers.html">
                    <i class="fas fa-users"></i>
                    <span>Khách Hàng</span>
                </a>
            </li>
            <li>
                <a href="staff.html">
                    <i class="fas fa-user-tie"></i>
                    <span>Nhân Viên</span>
                </a>
            </li>
            <li>
                <a href="reports.html">
                    <i class="fas fa-chart-bar"></i>
                    <span>Báo Cáo</span>
                </a>
            </li>
            <li class="active">
                <a href="messages.html">
                    <i class="fas fa-comments"></i>
                    <span>Tin Nhắn</span>
                </a>
            </li>
            <li>
                <a href="accounts.html">
                    <i class="fas fa-user-cog"></i>
                    <span>Tài Khoản</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <a href="#" onclick="auth.logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Đăng Xuất</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="main-header">
            <button class="btn-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            <h2>Quản Lý Tin Nhắn</h2>
            <div class="header-actions">
                <div class="user-info">
                    <span id="userName">Admin</span>
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container">
            <!-- Conversations List -->
            <div class="conversations-panel">
                <div class="conversations-header">
                    <h5><i class="fas fa-inbox me-2"></i>Hộp Thư</h5>
                    <div class="input-group mt-2">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input type="text" class="form-control" id="searchConversations" placeholder="Tìm kiếm...">
                    </div>
                </div>
                <div class="conversations-list" id="conversationsList">
                    <div class="text-center py-5">
                        <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
                        <p class="text-muted mt-2">Đang tải...</p>
                    </div>
                </div>
            </div>

            <!-- Chat Panel -->
            <div class="chat-panel" id="chatPanel">
                <div class="chat-empty">
                    <i class="fas fa-comments fa-3x text-muted"></i>
                    <h5 class="mt-3">Chọn một cuộc trò chuyện</h5>
                    <p class="text-muted">Chọn khách hàng từ danh sách bên trái để xem tin nhắn</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SignalR -->
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    
    <!-- Custom JS -->
    <script src="js/api-service.js"></script>
    <script src="js/ui-customization.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
