<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Khách hàng - Admin</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/notifications.css" />
  
  <!-- SignalR -->
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
  
  <!-- Sidebar Loader -->
  <script src="js/sidebar-loader.js"></script>
</head>
<body>
  <!-- Sidebar sẽ được load tự động bởi sidebar-loader.js -->

  <!-- Main Content -->
  <div class="main-content">
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container-fluid">
        <button class="btn btn-link" id="sidebarToggle">
          <i class="fas fa-bars"></i>
        </button>
        <div class="ms-auto d-flex align-items-center">
          <div class="d-flex align-items-center gap-2 me-3">
            <button id="themeToggleBtn" type="button" class="btn btn-sm btn-outline-secondary" onclick="uiCustomization.toggleTheme()"></button>
            <div id="langSwitcher"></div>
          </div>
          
          <!-- Notification Bell -->
          <div class="notification-wrapper me-3" style="position: relative;">
            <div class="notification-bell" id="notification-bell" style="cursor: pointer; padding: 8px 12px; font-size: 20px; position: relative;">
              🔔
              <span id="notification-badge" style="position: absolute; top: 0; right: 0; background-color: #dc3545; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; font-weight: bold; min-width: 18px; height: 18px; display: none; text-align: center; line-height: 14px;">0</span>
            </div>
            <div class="notification-dropdown" id="notification-dropdown" style="display: none;">
              <div class="notification-dropdown-header">
                <h6>Thông báo</h6>
                <a href="javascript:void(0)" class="mark-all-read" id="mark-all-read">Đánh dấu tất cả đã đọc</a>
              </div>
              <div id="notification-list">
                <div class="no-notifications">Đang tải...</div>
              </div>
            </div>
          </div>
          
          <div class="dropdown">
            <button class="btn btn-link dropdown-toggle text-decoration-none" type="button" data-bs-toggle="dropdown">
              <i class="fas fa-user-circle fa-lg me-2"></i>
              <span class="user-name">User</span>
              <span class="user-role badge bg-primary ms-2">Role</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><h6 class="dropdown-header"><span class="user-name">User</span></h6></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="profile.html"><i class="fas fa-user me-2"></i><span data-i18n="profile">Thông tin tài khoản</span></a></li>
              <li><a class="dropdown-item" href="settings.html"><i class="fas fa-cog me-2"></i><span data-i18n="settings">Cài đặt</span></a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" onclick="auth.logout()"><i class="fas fa-sign-out-alt me-2"></i><span data-i18n="logout">Đăng xuất</span></a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- Customers Content -->
    <div class="container-fluid p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-address-book"></i> <span data-i18n="customerManagement">Quản Lý Khách Hàng</span></h2>
        <button class="btn btn-primary" id="btnAddCustomer"><i class="fas fa-user-plus"></i> <span data-i18n="addCustomer">Thêm khách hàng</span></button>
      </div>

      <div id="customersAlert"></div>
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover" id="customersTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th data-i18n="customerName">Họ Tên</th>
                  <th data-i18n="phone">SĐT</th>
                  <th data-i18n="customerAddress">Địa chỉ</th>
                  <th data-i18n="ward">Phường</th>
                  <th data-i18n="district">Quận</th>
                  <th data-i18n="city">Thành phố</th>
                  <th data-i18n="actions">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colspan="8" class="text-center py-4" data-i18n="loading">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Add/Edit -->
  <div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" data-i18n="addEditCustomer">Thêm / Sửa Khách hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="customerForm">
            <input type="hidden" id="customerId">
            <div class="mb-3">
              <label class="form-label" data-i18n="customerName">Họ tên</label>
              <input id="fullName" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label" data-i18n="phone">Số điện thoại</label>
              <input id="phoneNumber" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label" data-i18n="customerAddress">Địa chỉ</label>
              <input id="address" class="form-control">
            </div>
            <div class="row">
              <div class="col-md-4 mb-3"><input id="ward" class="form-control" placeholder="Phường/Xã" data-i18n="wardPlaceholder"></div>
              <div class="col-md-4 mb-3"><input id="district" class="form-control" placeholder="Quận/Huyện" data-i18n="districtPlaceholder"></div>
              <div class="col-md-4 mb-3"><input id="city" class="form-control" placeholder="Thành phố" data-i18n="cityPlaceholder"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Hủy</button>
          <button type="button" class="btn btn-primary" id="saveCustomerBtn" data-i18n="saveCustomer">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api-service.js"></script>
  <script src="js/ui-customization.js"></script>
  <script src="js/notification-client.js"></script>
  <script src="js/customers.js"></script>
  
  <script>
    // Toggle notification dropdown
    document.getElementById('notification-bell')?.addEventListener('click', function(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('notification-dropdown');
      dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('notification-dropdown');
      const bell = document.getElementById('notification-bell');
      if (bell && dropdown && !bell.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    // Mark all as read
    document.getElementById('mark-all-read')?.addEventListener('click', async function() {
      if (window.notificationClient) {
        await window.notificationClient.markAllAsRead();
      }
    });

    // Khởi tạo Notification Client
    window.addEventListener('DOMContentLoaded', async function() {
      if (typeof signalR !== 'undefined' && typeof NotificationClient !== 'undefined') {
        window.notificationClient = new NotificationClient();
        await window.notificationClient.start();
      }
    });
  </script>
</body>
</html>
